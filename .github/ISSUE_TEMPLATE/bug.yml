name: Bug in a skill or tool
description: A tool crashed, or a skill gave a wrong result
labels: [bug]
body:
  - type: input
    id: skill
    attributes:
      label: Which skill or tool
      placeholder: /yt-retention, retention.py
    validations:
      required: true
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The command, or what you asked Claude. Attach the transcript or CSV if you can share it.
      render: shell
    validations:
      required: true
  - type: textarea
    id: got
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where you ran it
      placeholder: Claude Code 2.x on macOS / claude.ai / Codex
